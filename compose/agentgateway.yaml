# compose/agentgateway.yaml — AgentGateway v1.6.0 standalone config: API-key
# roles, MCP target routing, and the LLM route.
#
# Schema: https://agentgateway.dev/schema/config (binds -> listeners -> routes
# -> backends). Validate with `make validate-gateway`, which runs the real
# agentgateway binary with --validate-only.
#
# Mounted read-only into the `agentgateway` service (compose/core.yml), which
# runs `agentgateway -f /etc/agentgateway.yaml` and publishes 127.0.0.1:3000
# (the heretek-context-router default HERETEK_GATEWAY_URL).
#
# Routing contract (heretek-context-router `per-target` mode): one route per
# MCP target at path prefix /mcp/<target>, each holding exactly ONE target of
# the same name, so agentgateway forwards tool names unprefixed. Target names
# never contain `_` (agentgateway joins target and tool with `_`). Each target
# is the compose service labelled `heretek.mcp.target: <target>` in
# compose/profile-*.yml, reached by service DNS name and CONTAINER port
# (enforced by test/agentgateway-config.test.ts). Targets in a profile that is
# not running are simply unreachable.
#
# Not routed yet: `core` (no heretek-core MCP service exists in this repo) and
# `searxng` (SearXNG serves an HTTP JSON search API, not MCP).
#
# Roles: every request must carry `Authorization: Bearer <key>` matching
# AGENTGATEWAY_ADMIN_KEY (role `admin`) or AGENTGATEWAY_AGENT_KEY (role
# `agent`). agentgateway refuses to start if either variable is unset.
#   admin — every route.
#   agent — every route except the two targets that can drive processes or
#           the desktop (`mdb` debugger, `gui` computer-use-linux), which carry
#           an admin-only mcpAuthorization rule.

config:
  # The compose network is IPv4-only; binding [::] also fails outright on
  # hosts booted with ipv6.disable=1.
  enableIpv6: false

binds:
- port: 3000
  listeners:
  - name: ingress
    routes:
    # appsec profile
    - name: ghidra
      matches:
      - path:
          pathPrefix: /mcp/ghidra
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: ghidra
            mcp:
              host: http://ghidra-mcp:8089/mcp
    - name: radare2
      matches:
      - path:
          pathPrefix: /mcp/radare2
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: radare2
            mcp:
              host: http://radare2-mcp:8765/mcp
    - name: rea
      matches:
      - path:
          pathPrefix: /mcp/rea
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: rea
            mcp:
              host: http://rea-mcp:8766/mcp
    - name: mdb
      matches:
      - path:
          pathPrefix: /mcp/mdb
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
        mcpAuthorization:
          rules:
          - allow: 'apiKey.role == "admin"'
      backends:
      - mcp:
          targets:
          - name: mdb
            mcp:
              host: http://mdb-mcp:8767/mcp
    # android profile
    - name: adb
      matches:
      - path:
          pathPrefix: /mcp/adb
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: adb
            mcp:
              host: http://adb-mcp:8770/mcp
    - name: maestro
      matches:
      - path:
          pathPrefix: /mcp/maestro
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: maestro
            mcp:
              host: http://maestro-mcp:8771/mcp
    # game profile
    - name: godot
      matches:
      - path:
          pathPrefix: /mcp/godot
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: godot
            mcp:
              host: http://godot-mcp:8780/mcp
    - name: blender
      matches:
      - path:
          pathPrefix: /mcp/blender
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: blender
            mcp:
              host: http://blender-mcp:8781/mcp
    # research profile
    - name: crawl4ai
      matches:
      - path:
          pathPrefix: /mcp/crawl4ai
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - mcp:
          targets:
          - name: crawl4ai
            sse:
              host: http://crawl4ai:11235/mcp/sse
    - name: gui
      matches:
      - path:
          pathPrefix: /mcp/gui
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
        mcpAuthorization:
          rules:
          - allow: 'apiKey.role == "admin"'
      backends:
      - mcp:
          targets:
          - name: gui
            mcp:
              host: http://computer-use-linux:8790/mcp
    # OpenAI-compatible LLM traffic (/v1/chat/completions, ...) forwarded to
    # Bifrost's 3-tier failover gateway (compose/bifrost.yaml).
    - name: llm-default
      matches:
      - path:
          pathPrefix: /v1
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGENTGATEWAY_ADMIN_KEY
            metadata:
              role: admin
          - key: $AGENTGATEWAY_AGENT_KEY
            metadata:
              role: agent
      backends:
      - ai:
          name: bifrost
          hostOverride: bifrost:8080
          provider:
            openAI: {}
