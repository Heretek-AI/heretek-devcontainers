# compose/core.yml — `core` profile: LLM gateway, agent gateway, message bus (Wave 1)
#
# Always-loaded foundation. Every service is hardened fail-closed:
# pinned image, 127.0.0.1 loopback ports only, cap_drop ALL,
# no-new-privileges, :Z SELinux volume labels, non-root user, zero socket mounts.
name: heretek-core

services:
  bifrost:
    image: ghcr.io/maximhq/bifrost:v2.3.0
    user: "1000:1000"
    restart: unless-stopped
    # Bifrost v2 has no `-config` flag: the image entrypoint runs /app/main,
    # which reads $APP_DIR/config.json (APP_DIR=/app/data) and listens on 8080.
    environment:
      BIFROST_API_KEY: ${BIFROST_API_KEY:?BIFROST_API_KEY is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bifrost-data:/app/data
      # Routing/failover intent (compose/bifrost.yaml). Bifrost v2 does not
      # read this YAML; it is mounted for operators translating it into
      # config.json in the bifrost-data volume.
      - ./bifrost.yaml:/app/config.yaml:ro,Z
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.6.0
    user: "1000:1000"
    restart: unless-stopped
    # The image ENTRYPOINT is /app/agentgateway; `-f` loads the standalone
    # config file (validated by `make validate-gateway`).
    command: ["-f", "/etc/agentgateway.yaml"]
    environment:
      # API keys for the two gateway roles; agentgateway refuses to start when
      # a referenced variable is unset (fail closed).
      AGENTGATEWAY_ADMIN_KEY: ${AGENTGATEWAY_ADMIN_KEY:?AGENTGATEWAY_ADMIN_KEY is required}
      AGENTGATEWAY_AGENT_KEY: ${AGENTGATEWAY_AGENT_KEY:?AGENTGATEWAY_AGENT_KEY is required}
    depends_on:
      bifrost:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./agentgateway.yaml:/etc/agentgateway.yaml:ro,Z
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    # No healthcheck: the image is distroless (no shell, no wget/curl) and
    # agentgateway has no self-probe subcommand.

  nats:
    image: nats:2.15.1-alpine
    user: "1000:1000"
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/varz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bifrost-data:
    driver: local
  nats-data:
    driver: local
