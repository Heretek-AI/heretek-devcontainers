# compose/profile-research.yml — `research` on-demand domain profile (Wave 2)
#
# SearXNG (isolated behind HTTP JSON REST) + Crawl4AI (Apache-2.0, non-AGPL
# scraping core) + headless Sway/AT-SPI2 computer-use MCP server.
# Activated on demand via:
#   docker compose --profile research up
# (or `--profile all` for everything). Every service is hardened fail-closed:
# pinned image, 127.0.0.1 loopback ports only, cap_drop ALL,
# no-new-privileges, non-root user, zero socket mounts.
#
# searxng and crawl4ai are published images pinned to exact release tags.
# computer-use-linux publishes no image, so it is a pinned local build
# (images/computer-use-linux/Dockerfile) tagged localhost/heretek/...:<version>;
# `pull_policy: build` keeps compose from pulling the local name.
# MCP endpoints are declared with `heretek.mcp.*` labels for the gateway.
services:
  searxng:
    image: searxng/searxng:2026.10.16-0ce72dd2c
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["research", "all"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
      BASE_URL: http://127.0.0.1:8888/
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - searxng-config:/etc/searxng
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  crawl4ai:
    image: unclecode/crawl4ai:0.9.5
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["research", "all"]
    shm_size: "1g"
    # crawl4ai's server exposes its MCP tools over SSE at /mcp/sse.
    labels:
      heretek.mcp.target: crawl4ai
      heretek.mcp.transport: sse
      heretek.mcp.path: /mcp/sse
    ports:
      - "127.0.0.1:11235:11235"
    volumes:
      - crawl4ai-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11235/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  computer-use-linux:
    image: localhost/heretek/computer-use-linux:0.7.17
    build:
      context: ../images/computer-use-linux
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["research", "all"]
    # Headless Sway + AT-SPI2 accessibility tree (no GPU / no display).
    environment:
      WLR_BACKENDS: headless
      SWAY_HEADLESS: "1"
    labels:
      heretek.mcp.target: gui
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - computer-use-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  searxng-config:
    driver: local
  crawl4ai-data:
    driver: local
  computer-use-data:
    driver: local
