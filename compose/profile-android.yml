# compose/profile-android.yml — `android` on-demand domain profile (Wave 2)
#
# KVM emulator + ADB/Maestro MCP bridges. Activated on demand via:
#   docker compose --profile android up
# (or `--profile all` for everything). Every service is hardened fail-closed:
# pinned image, 127.0.0.1 loopback ports only, cap_drop ALL,
# no-new-privileges, non-root user, zero socket mounts.
#
# `android-kvm` passes through /dev/kvm via `devices:` (a device mapping,
# not a volume mount — no SELinux label rule applies to it).
#
# android-kvm pins the immutable release tag emulator_14.0_v3.8.0-p1 (the bare
# emulator_14.0 tag is re-pointed on every docker-android release). The two MCP
# bridges have no usable published HTTP image, so they are pinned local builds
# (images/<service>/Dockerfile) tagged localhost/heretek/<service>:<version>;
# `pull_policy: build` keeps compose from pulling the local names. Both speak
# MCP over streamable HTTP at /mcp (see the `heretek.mcp.*` labels).
services:
  android-kvm:
    image: budtmo/docker-android:emulator_14.0_v3.8.0-p1
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["android", "all"]
    devices:
      - "/dev/kvm:/dev/kvm"
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5555:5555"
    volumes:
      - android-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  adb-mcp:
    image: localhost/heretek/adb-mcp:0.23.0
    build:
      context: ../images/adb-mcp
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["android", "all"]
    depends_on:
      android-kvm:
        condition: service_started
    environment:
      ANDROID_HOST: android-kvm
      ADB_PORT: "5555"
    labels:
      heretek.mcp.target: adb
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - adb-mcp-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  maestro-mcp:
    image: localhost/heretek/maestro-mcp:2.11.0
    build:
      context: ../images/maestro-mcp
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["android", "all"]
    depends_on:
      android-kvm:
        condition: service_started
    # The image entrypoint attaches adb to android-kvm, then serves
    # `maestro mcp` over streamable HTTP via mcp-proxy.
    environment:
      ANDROID_HOST: android-kvm
      ADB_PORT: "5555"
    labels:
      heretek.mcp.target: maestro
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8771:8771"
    volumes:
      - maestro-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8771/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  android-data:
    driver: local
  adb-mcp-data:
    driver: local
  maestro-data:
    driver: local
