# compose/profile-appsec.yml — `appsec` on-demand domain profile (Wave 2)
#
# Reverse-engineering / binary-analysis MCP servers. Activated on demand via:
#   docker compose --profile appsec up
# (or `--profile all` for everything). Every service is hardened fail-closed:
# pinned image, 127.0.0.1 loopback ports only, cap_drop ALL,
# no-new-privileges, :Z SELinux bind labels, non-root user, zero socket mounts.
#
# NOTE: `mdb-mcp` carries the SOLE documented capability exception in this
# repo — a narrow SYS_PTRACE grant required for debugger attachment.
# It still drops all other capabilities and keeps no-new-privileges.
#
# None of these upstreams publishes a usable container image, so each service
# is a pinned local build (images/<service>/Dockerfile) tagged
# localhost/heretek/<service>:<upstream version>. `pull_policy: build` keeps
# compose from ever trying to pull the local name from a registry.
# Every service speaks MCP over streamable HTTP at /mcp on its container port;
# the `heretek.mcp.*` labels are what compose/agentgateway.yaml routes to
# (enforced by test/agentgateway-config.test.ts).
services:
  ghidra-mcp:
    image: localhost/heretek/ghidra-mcp:6.0.0
    build:
      context: ../images/ghidra-mcp
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["appsec", "all"]
    environment:
      GHIDRA_MCP_AUTH_TOKEN: ${GHIDRA_MCP_AUTH_TOKEN:?GHIDRA_MCP_AUTH_TOKEN is mandatory}
      # The bridge keeps DNS-rebinding protection on; allow the compose DNS
      # name the agent gateway uses as its Host header, plus host loopback.
      GHIDRA_MCP_ALLOWED_HOSTS: ghidra-mcp,localhost,127.0.0.1
    labels:
      heretek.mcp.target: ghidra
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8089:8089"
    volumes:
      - ./data/ghidra-mcp:/data:Z
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  radare2-mcp:
    image: localhost/heretek/radare2-mcp:1.9.0
    build:
      context: ../images/radare2-mcp
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["appsec", "all"]
    # Container-internal listen address (NOT a published host port — the
    # published port below is loopback-only). `-R` exposes only the read-only
    # tool set (`-r` would ENABLE the dangerous run_* tools); `-s /data`
    # sandboxes file access to the data volume.
    command: ["r2mcp", "-H", "0.0.0.0:8765", "-R", "-s", "/data"]
    labels:
      heretek.mcp.target: radare2
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - radare2-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8765"]
      interval: 30s
      timeout: 5s
      retries: 3

  rea-mcp:
    image: localhost/heretek/rea-mcp:6.5.0
    build:
      context: ../images/rea-mcp
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["appsec", "all"]
    labels:
      heretek.mcp.target: rea
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - rea-data:/data
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mdb-mcp:
    # Upstream has no release tag; the build pins commit 5d03b25 (version 0.2.0).
    image: localhost/heretek/mdb-mcp:0.2.0-5d03b25
    build:
      context: ../images/mdb-mcp
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["appsec", "all"]
    labels:
      heretek.mcp.target: mdb
      heretek.mcp.transport: streamable-http
      heretek.mcp.path: /mcp
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - mdb-data:/data
    cap_drop: [ALL]
    # SOLE documented exception: narrow SYS_PTRACE for debugger attachment.
    cap_add: [SYS_PTRACE]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  radare2-data:
    driver: local
  rea-data:
    driver: local
  mdb-data:
    driver: local
