# devcontainers/polyglot-dev/mise.toml — pinned polyglot toolchain (Wave 3)
#
# Consumed by the `polyglot-dev` devcontainer (`postCreateCommand: mise install`)
# and by `scripts/heretek-exec.sh` via `mise exec` (Report 05a §7.2 Recipe 3).
# Every tool is pinned to an exact version — never floated. Refresh pins with:
#   mise outdated
# then commit the bumped pins (the static verifier rejects floating tags in
# compose/quadlet images; this file upholds the same discipline for tools).

[tools]
node = "22.9.0"
python = "3.12.7"
rust = "1.80.0"
go = "1.23.3"
bun = "1.4.2"
"npm:@ast-grep/cli" = "0.39.5"
"cargo:fallow" = "0.1.3"

[settings]
jobs = 4
verbose = false

[env]
HERETEK_PROFILE = "polyglot-dev"
