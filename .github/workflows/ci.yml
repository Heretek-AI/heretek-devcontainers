# .github/workflows/ci.yml — static verifier, unit tests, acceptance gates and
# config validation with the real agentgateway binary.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      AGENTGATEWAY_VERSION: v1.6.0
      # SHA-256 published with the v1.6.0 release (agentgateway-linux-amd64.sha256).
      AGENTGATEWAY_SHA256: 496ed27e6a96b55a9ad7cabe5c2be7172511f44a3cb113e533d22bf93a7f079d
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: make check
        run: make check

      - name: make accept
        run: make accept

      - name: Download agentgateway
        run: |
          mkdir -p "$RUNNER_TEMP/agentgateway"
          curl -fsSL -o "$RUNNER_TEMP/agentgateway/agentgateway" \
            "https://github.com/agentgateway/agentgateway/releases/download/${AGENTGATEWAY_VERSION}/agentgateway-linux-amd64"
          echo "${AGENTGATEWAY_SHA256}  $RUNNER_TEMP/agentgateway/agentgateway" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/agentgateway/agentgateway"

      - name: make validate-gateway
        run: make validate-gateway AGENTGATEWAY="$RUNNER_TEMP/agentgateway/agentgateway"

      - name: make validate-compose
        run: make validate-compose

      - name: make validate-units
        run: make validate-units
